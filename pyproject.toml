[project]
name = "incidentops-starter"
version = "0.1.0"
description = "Proyecto semilla IncidentOps para Semana 1 de Ingeniería de Software Asistida por IA (ISIA)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tiktoken>=0.8.0",
    "fastapi",
    "uvicorn",
    "pydantic>=2,<3",
    "typer",
    "psycopg[binary]>=3.3.9",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "TID"]
